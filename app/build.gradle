plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingFile = rootProject.file('signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'com.aurora.tvplayer'
    compileSdk 37

    defaultConfig {
        applicationId 'com.aurora.tvplayer'
        minSdk 28
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 23
        versionName '3.4.0'
        // TVs and set-top boxes are ARM; x86 builds would only add ~12 MB of FFmpeg for emulators.
        //noinspection ChromeOsAbiSupport
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // Screenshot tests render the real Compose screens on the JVM (Robolectric), no device needed.
    testOptions { unitTests { includeAndroidResources = true } }
}

dependencies {
    def media3 = '1.11.1'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.tv:tv-material:1.1.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    // jcifs-ng pins BouncyCastle 1.76, which has known CVEs; the API it uses is unchanged in 1.86.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    // QR codes on the "Поддержать автора" screen (Apache 2.0); R8 keeps only the encoder.
    implementation 'com.google.zxing:core:3.5.4'
    // FFmpeg audio/video decoders for Media3 (GPL-3.0), built against Media3 $media3, 16 KB aligned.
    implementation "io.github.anilbeesetti:nextlib-media3ext:$media3-0.16.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation platform('androidx.compose:compose-bom:2026.09.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
